cargo-features = ["edition2024"]

[package]
name = "app"
version = "1.0.0"
authors = ["The Teaclave Authors"]
build = "build.rs"
edition = "2024"

[dependencies]
actix-web = "4.0"
actix-rt = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sgx_types = { path = "/opt/teaclave-sgx-sdk/sgx_types" }
sgx_urts = { path = "/opt/teaclave-sgx-sdk/sgx_urts" }
lazy_static = "1.4.0"
jsonwebtoken = "8.1" 
reqwest = { version = "0.11", features = ["json"] }
